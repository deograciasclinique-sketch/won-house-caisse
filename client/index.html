<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12100D" media="(prefers-color-scheme: dark)">
<title>WON HOUSE · Menu et commande</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Le menu du restaurant WON HOUSE. Commandez sur place, à emporter ou en livraison.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WON HOUSE">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
:root{
  --bg:#FBFAF7; --surface:#FFFFFF; --surface-2:#F1ECE3; --ink:#17150F; --muted:#6B655C; --line:#E7E1D6; --line-2:#EEE8DE;
  --accent:#C2410C; --accent-ink:#9A3412; --accent-soft:#FFF1E8;
  --night:#17150F; --night-2:#2A2620; --night-ink:#FBFAF7; --night-muted:#D6CFC3;
  --good:#15803D; --good-soft:#ECF6EF; --good-ink:#14532D; --good-ring:#DCF2E3;
  --warn-soft:#FFF7E6; --warn-ink:#78350F; --gold:#F59E0B;
  --bad:#B42318; --bad-soft:#FBE7E4;
  --t1:#F6E3D3; --t2:#F3EBD4; --t3:#E7EEDD; --t4:#F4DEDA;
  --shadow:0 12px 28px rgba(23,21,15,.28);
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12100D; --surface:#1C1915; --surface-2:#2A2620; --ink:#F3EEE6; --muted:#B3AA9E; --line:#332E27; --line-2:#2A2620;
  --accent:#C2410C; --accent-ink:#FDBA8C; --accent-soft:#3A2116;
  --night:#24201B; --night-2:#332E27; --night-ink:#F3EEE6; --night-muted:#C9C0B3;
  --good:#22A055; --good-soft:#16301F; --good-ink:#86EFAC; --good-ring:#1D3D28;
  --warn-soft:#33270F; --warn-ink:#FCD34D; --bad:#F2786B; --bad-soft:#3B1D1A;
  --t1:#3A2A20; --t2:#363020; --t3:#26301F; --t4:#3A2422;
  --shadow:0 12px 28px rgba(0,0,0,.5);
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-appearance:none;appearance:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{display:block}
.ico{width:20px;height:20px;flex:none}
.disp{font-family:var(--display);font-weight:800;letter-spacing:-.01em}
main{max-width:560px;margin:0 auto;padding:0 0 120px}
.pad{padding-left:20px;padding-right:20px}

/* en-tête */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(16px + env(safe-area-inset-top,0px)) 20px 0}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:42px;height:42px;border-radius:13px;background:var(--night);color:var(--night-ink);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:16px}
.brand b{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.02em;display:block;line-height:1.15}
.statut{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--good)}
.statut i{width:7px;height:7px;border-radius:50%;background:currentColor}
.statut.ferme{color:var(--bad)}
.rond{width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative;flex:none;text-decoration:none;color:var(--ink)}
.rond .pastille{position:absolute;top:-5px;right:-5px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
h1.titre{margin:18px 20px 14px;font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em}
.cherche{display:flex;align-items:center;gap:10px;height:48px;margin:0 20px;padding:0 14px;border-radius:15px;background:var(--surface);border:1px solid var(--line);color:var(--muted)}
.cherche input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--ink);font-size:16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 20px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:40px;padding:0 16px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.bandeau{margin:12px 20px 0;border-radius:16px;padding:12px 14px;font-weight:700;font-size:14px}
.bandeau.ko{background:var(--bad-soft);color:var(--bad)}
.bandeau.info{background:var(--surface-2)}

/* plat vedette */
.vedette{border:1px solid var(--line) !important;display:flex;margin:16px 20px 0;border-radius:22px;background:var(--night);color:var(--night-ink);overflow:hidden;min-height:132px;border:0;padding:0;width:calc(100% - 40px);text-align:left}
.vedette .txt{flex:1;padding:16px 0 16px 18px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.badge{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--gold);color:#17150F;padding:4px 8px;border-radius:99px}
.vedette .nom{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1}
.vedette small{color:var(--night-muted);font-size:13.5px}
.vedette .vph{width:150px;flex:none;position:relative;display:block}
.vedette .vph .ph{position:absolute;inset:0}
.vedette .plus{position:absolute;right:12px;bottom:12px;width:44px;height:44px;border-radius:50%;background:var(--night-ink);color:var(--night);display:grid;place-items:center}

/* photos */
.ph{background:var(--t1);display:grid;place-items:center;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .25s}
.ph img.ok{opacity:1}
.ph .emo{font-size:38px;line-height:1}
.tint1{background:var(--t1)}.tint2{background:var(--t2)}.tint3{background:var(--t3)}.tint4{background:var(--t4)}

/* grille */
.rubrique{display:flex;align-items:baseline;justify-content:space-between;padding:22px 20px 0}
.rubrique h2{margin:0;font-family:var(--display);font-weight:800;font-size:20px}
.rubrique span{color:var(--muted);font-size:13px}
.grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 20px 0}
.carte{background:var(--surface);border-radius:20px;border:1px solid var(--line-2);overflow:hidden;display:flex;flex-direction:column;position:relative}
.carte.off{opacity:.55}
.carte .ouvrir{all:unset;cursor:pointer;display:block}
.carte .ouvrir:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:20px}
.carte .ph{height:118px}
.carte .dans{position:absolute;top:10px;left:10px;background:var(--night);color:var(--night-ink);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.carte .epuise{position:absolute;top:10px;left:10px;background:var(--surface);color:var(--muted);font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px}
.carte .bas{padding:10px 8px 10px 12px;display:flex;align-items:flex-end;justify-content:space-between;gap:6px}
.carte .nom{font-weight:700;font-size:15px;line-height:1.25;display:block}
.carte .compo-c{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);font-size:12.5px;line-height:1.35;margin-top:2px}
.compo{margin:8px 0 0;color:var(--muted);font-size:15px;line-height:1.5}
.carte .prix{font-family:var(--display);font-weight:800;font-size:16px;margin-top:4px;display:block}
.carte .prix small{font-family:var(--body);font-weight:500;font-size:12.5px;color:var(--muted)}
.ajout{width:44px;height:44px;border-radius:14px;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.vide{color:var(--muted);text-align:center;padding:44px 20px}

/* barre panier */
#barre{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:28px 16px calc(16px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(251,250,247,0),var(--bg) 40%);pointer-events:none}
@media (prefers-color-scheme:dark){#barre{background:linear-gradient(rgba(18,16,13,0),var(--bg) 40%)}}
#barre button{pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;max-width:528px;margin:0 auto;height:62px;padding:0 8px 0 18px;border:0;border-radius:20px;background:var(--night);color:var(--night-ink);box-shadow:var(--shadow);text-align:left}
#barre .l{display:flex;flex-direction:column;line-height:1.2}
#barre .l b{font-size:15px}
#barre .l span{font-size:12.5px;color:var(--night-muted)}
#barre .p{margin-left:auto;background:var(--accent);color:#fff;height:46px;padding:0 16px;border-radius:14px;display:flex;align-items:center;font-family:var(--display);font-weight:800;font-size:16px}
@media (prefers-reduced-motion:no-preference){#barre button.pop{animation:pop .3s ease}@keyframes pop{40%{transform:scale(1.03)}}}

/* feuille (fiche du plat) */
.voile{position:fixed;inset:0;z-index:20;background:rgba(23,21,15,.55);display:flex;align-items:flex-end;justify-content:center}
.feuille{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (prefers-reduced-motion:no-preference){.feuille{animation:monte .28s cubic-bezier(.2,.8,.2,1)}@keyframes monte{from{transform:translateY(40%);opacity:.4}}}
.poignee{width:40px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 0}
.feuille .ph{margin:14px 16px 0;height:236px;border-radius:22px}
.feuille .ph .emo{font-size:72px}
.feuille .fermer{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface);color:var(--ink);display:grid;place-items:center;z-index:1}
.fiche-tete{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:18px 20px 0}
.fiche-tete h2{margin:0;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.fiche-tete .prix{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent);white-space:nowrap}
@media (prefers-color-scheme:dark){.fiche-tete .prix{color:var(--accent-ink)}}
.lab{display:block;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 10px}
.tailles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.taille{height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14.5px}
.taille.on{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.taille:disabled{opacity:.45;text-decoration:line-through}
.fiche-bas{display:flex;gap:12px;align-items:center;padding:16px 20px 0;margin-top:20px;border-top:1px solid var(--line-2)}
.stepper{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:16px;padding:4px}
.stepper button{width:44px;height:48px;border:0;border-radius:12px;background:var(--surface);display:grid;place-items:center}
.stepper b{min-width:30px;text-align:center;font-size:18px}
.gros{flex:1;height:56px;border:0;border-radius:18px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:16px;text-decoration:none}
.gros .disp{font-size:17px}
.gros:disabled{opacity:.6}

/* commande */
.entete{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0}
.entete h1{margin:0;font-family:var(--display);font-weight:800;font-size:22px}
.boite{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:4px 12px}
.ligne{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ligne:last-child{border-bottom:0}
.ligne .ph{width:48px;height:48px;border-radius:14px;flex:none}
.ligne .ph .emo{font-size:24px}
.ligne .n{flex:1;min-width:0;display:flex;flex-direction:column}
.ligne .n b{font-size:14.5px}
.ligne .n span{color:var(--muted);font-size:13px}
.mini{display:flex;align-items:center;gap:2px;background:var(--surface-2);border-radius:12px;padding:2px}
.mini button{width:36px;height:40px;border:0;border-radius:10px;background:transparent;font-size:19px;font-weight:700;display:grid;place-items:center}
.mini b{min-width:18px;text-align:center}
.sec{padding:0 16px}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mode{height:66px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.mode.on{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.champ{width:100%;height:50px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;font-size:16px}
.champ:focus{border-color:var(--accent);outline:0}
.lab2{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 2px 6px}
.carte-geo{margin-top:10px;border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px dashed var(--accent);color:var(--accent-ink);width:100%;text-align:left}
.carte-geo.ok{background:var(--good-soft);border:0;color:var(--good-ink)}
.carte-geo .pin{width:40px;height:40px;border-radius:12px;background:var(--surface);display:grid;place-items:center;flex:none;color:var(--accent)}
.carte-geo.ok .pin{color:var(--good)}
.carte-geo .t{flex:1;display:flex;flex-direction:column;line-height:1.3}
.carte-geo .t b{font-size:14px}
.carte-geo .t span{font-size:13px}
.pay{display:flex;flex-direction:column;gap:8px}
.payopt{height:60px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left}
.payopt.on{border:2px solid var(--accent);background:var(--accent-soft)}
.payopt .r{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);flex:none}
.payopt.on .r{border:6px solid var(--accent);background:#fff}
.payopt .t{flex:1;display:flex;flex-direction:column;line-height:1.25}
.payopt .t b{font-size:14.5px}
.payopt .t span{font-size:12.5px;color:var(--muted)}
.alerte{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:11px 13px;font-weight:700;margin:14px 16px 0}
.note{color:var(--muted);font-size:13px;margin:8px 2px 0}
.total-bas{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line-2);border-radius:24px 24px 0 0;box-shadow:0 -8px 24px rgba(23,21,15,.06);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.total-bas .in{max-width:528px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.total-bas .det{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.total-bas .gros{justify-content:space-between;padding:0 20px;width:100%}

/* suivi */
.suivi-tete{background:var(--night);color:var(--night-ink);padding:calc(16px + env(safe-area-inset-top,0px)) 20px 26px;border-radius:0 0 30px 30px;display:flex;flex-direction:column;gap:18px}
.suivi-tete .rond{background:var(--night-2);border:0;color:var(--night-ink)}
.suivi-tete small{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--night-muted);font-weight:700}
.code{font-family:var(--display);font-weight:800;font-size:46px;letter-spacing:.06em;line-height:1}
.etat-titre{font-family:var(--display);font-weight:800;font-size:22px}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.prog i{height:6px;border-radius:99px;background:var(--night-2)}
.prog i.f{background:var(--gold)}
.prog.ko i{background:var(--bad)}
.etapes{padding:20px 24px 0}
.etape{display:flex;gap:14px}
.etape .col{display:flex;flex-direction:column;align-items:center}
.etape .pt{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);background:var(--surface);flex:none}
.etape.f .pt{background:var(--good);border-color:var(--good);color:#fff}
.etape.now .pt{box-shadow:0 0 0 6px var(--good-ring)}
@media (prefers-reduced-motion:no-preference){.etape.now .pt{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px var(--good-ring)}}}
.etape .trait{width:2px;height:28px;margin:4px 0;background:var(--line)}
.etape.f .trait{background:var(--good)}
.etape .t{padding-top:2px;color:var(--muted);font-weight:500}
.etape.f .t,.etape.now .t{color:var(--ink);font-weight:700}
.info-pay{margin:14px 16px 0;border-radius:18px;padding:12px 14px;display:flex;gap:12px;align-items:center;background:var(--warn-soft);color:var(--warn-ink)}
.info-pay.ok{background:var(--good-soft);color:var(--good-ink)}
.info-pay .t{display:flex;flex-direction:column;line-height:1.3;font-size:13px}
.info-pay .t b{font-size:14px}
.payer{margin:14px 16px 0;background:var(--surface);border:2px solid var(--gold);border-radius:20px;padding:16px}
.payer h3{font-family:var(--display);font-size:18px;margin:0 0 4px}
.payer ol{padding-left:20px;margin:12px 0;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.lien{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;height:50px;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-weight:700;color:var(--ink);text-decoration:none}
.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;padding:18px 16px 0}
.duo .lien{margin:0;height:56px;border-radius:18px}
.duo .lien.noir{background:var(--night);color:var(--night-ink);border:0}
.mes{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:14px;margin-bottom:8px;text-align:left}
.mes span{color:var(--muted);font-size:13.5px}
/* installer l'icône */
.inst{display:flex;align-items:center;gap:12px;margin:14px 20px 0;padding:12px 10px 12px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.inst img{width:48px;height:48px;border-radius:13px;flex:none}
.inst .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.inst .t b{font-size:14.5px}
.inst .t span{font-size:12.5px;color:var(--muted)}
.inst .go{height:40px;padding:0 14px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;flex:none}
.inst .x{width:36px;height:36px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none;margin-left:-4px}
.acc-inst{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:transparent;color:#FBFAF7;font-weight:700;font-size:14.5px}
