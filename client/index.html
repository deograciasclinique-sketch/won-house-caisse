<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7A1726">
<title>WON HOUSE · Menu et commande</title>
<meta name="description" content="Le menu du restaurant WON HOUSE. Commandez sur place, à emporter ou en livraison.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
:root{
  --bg:#F6F1EA; --surface:#FFFFFF; --surface-2:#F0E8DD; --ink:#22140F; --muted:#6E5F57; --line:#E3D7C9;
  --accent:#8C1D2B; --accent-soft:#F6E2E3; --gold:#E39A1E; --good:#1F7A4D; --good-soft:#E1F1E8; --bad:#B42318; --bad-soft:#FBE7E4;
  --grad:linear-gradient(135deg,#7A1726,#B8352A 55%,#E39A1E);
  --display:"Sora",system-ui,sans-serif; --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#161110; --surface:#211917; --surface-2:#2C221F; --ink:#F3ECE6; --muted:#B3A49B; --line:#3A2E2A;
  --accent:#E87A86; --accent-soft:#3A1E22; --good:#5CC48E; --good-soft:#18332A; --bad:#F2786B; --bad-soft:#3B1D1A;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.hero{background:var(--grad);color:#fff;padding:calc(22px + env(safe-area-inset-top,0px)) 20px 26px;border-radius:0 0 28px 28px;text-align:center}
.hero .logo{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.16);display:grid;place-items:center;margin:0 auto 8px}
.hero h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.08em;margin:0}
.hero p{margin:4px 0 0;opacity:.9;font-size:14px}
main{max-width:560px;margin:0 auto;padding:16px 16px 120px}
h2{font-family:var(--display);font-size:19px;margin:18px 2px 10px}
.carte{display:flex;flex-direction:column;gap:10px}
.plat{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px}
.plat.pris{border-color:var(--gold);box-shadow:0 0 0 2px rgba(227,154,30,.25)}
.plat.off{opacity:.55}
.plat .emo{width:50px;height:50px;border-radius:15px;background:var(--surface-2);display:grid;place-items:center;font-size:27px;flex:none}
.plat .nom{flex:1;min-width:0;display:flex;flex-direction:column}
.plat .nom b{font-size:16px}
.plat .nom span{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.ajout{border:0;border-radius:12px;padding:10px 14px;font-weight:800;color:#fff;background:var(--accent)}
.qte{display:flex;align-items:center;gap:6px}
.qte button{width:36px;height:36px;border-radius:11px;border:0;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:800}
.qte b{min-width:22px;text-align:center;font-size:17px}
#barre{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 35%)}
#barre button{display:flex;align-items:center;gap:10px;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:18px;padding:15px 16px;background:var(--grad);color:#fff;font-weight:800;font-size:16px;box-shadow:0 10px 24px rgba(122,23,38,.35)}
#barre .n{background:#fff;color:var(--accent);border-radius:99px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px}
#barre b{margin-left:auto}
.alerte{background:var(--bad-soft);color:var(--bad);border-radius:14px;padding:11px 13px;font-weight:700;margin:6px 0 10px}
.info{background:var(--surface-2);border-radius:14px;padding:10px 13px;margin:4px 0 6px}
.vide{color:var(--muted);text-align:center;padding:40px 10px}
.retour{background:none;border:0;color:var(--accent);font-weight:800;padding:6px 0}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:6px 14px}
.ligne{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.ligne:last-child{border-bottom:0}
.ligne.tot{font-size:17px}
.lab{display:block;font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:16px 2px 6px}
input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:13px;font-size:16px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.modes button{border:1.5px solid var(--line);background:var(--surface);border-radius:13px;padding:12px 4px;font-weight:800;font-size:13.5px}
.modes button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.envoyer{width:100%;margin-top:18px;border:0;border-radius:16px;padding:16px;font-size:16.5px;font-weight:800;color:#fff;background:var(--grad)}
.envoyer:disabled{opacity:.6}
.petit{color:var(--muted);font-size:13px;text-align:center;margin:10px 0}
.lien{display:block;width:100%;text-align:center;margin-top:14px;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;font-weight:800;color:var(--accent);text-decoration:none}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;text-align:center;margin:8px 0 14px}
.ticket small{color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:800;font-size:11.5px}
.ticket .code{font-family:var(--display);font-size:42px;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.ticket .etat{font-weight:800;font-size:16px;margin-top:4px;color:var(--good)}
.ticket .etat.ko{color:var(--bad)}
.etapes{display:flex;flex-direction:column;gap:2px;margin:0 0 14px;padding:0 4px}
.etape{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;padding:6px 0}
.etape .pt{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:13px;flex:none}
.etape.fait{color:var(--ink)}
.etape.fait .pt{background:var(--good);color:#fff}
.etape.now .pt{box-shadow:0 0 0 5px var(--good-soft)}
@media (prefers-reduced-motion:no-preference){.etape.now .pt{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{box-shadow:0 0 0 9px var(--good-soft)}}}
.mes{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:8px;text-align:left}
.mes span{color:var(--muted);font-size:13.5px}
</style>
<script src="config.js"></script>
</head>
<body>
<header class="hero">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 40 40" width="44" height="44" fill="none"><g stroke="#FFE2B0" stroke-width="2.2" stroke-linecap="round"><path d="M14 13c-2-3 2-4 0-7"/><path d="M20 13c-2-3 2-4 0-7"/><path d="M26 13c-2-3 2-4 0-7"/></g><ellipse cx="20" cy="25" rx="15" ry="4.2" fill="#fff"/><path d="M8 24c1 7 6 10 12 10s11-3 12-10" fill="#fff"/><ellipse cx="20" cy="24" rx="11" ry="2.6" fill="#F3C969"/></svg></div>
  <h1>WON HOUSE</h1>
  <p>Menu et commande en ligne</p>
</header>
<main id="vue"></main>
<div id="barre" hidden></div>
<script src="client.js"></script>
</body>
</html>
