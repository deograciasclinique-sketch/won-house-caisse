name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer l'application
        run: |
          npm run build
          npx cap sync android

      - name: Construire l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Pvc=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../WON-HOUSE-caisse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WON-HOUSE-caisse-apk
          path: WON-HOUSE-caisse.apk

      - name: Publier la version (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: WON HOUSE caisse v1.${{ github.run_number }}
          body: |
            Application Android de caisse du restaurant WON HOUSE.
            Téléchargez **WON-HOUSE-caisse.apk** sur le téléphone puis ouvrez-le pour l'installer.
          files: WON-HOUSE-caisse.apk
          make_latest: true
