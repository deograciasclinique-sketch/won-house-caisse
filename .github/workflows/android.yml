name: Construire l'APK Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Préparer l'application
        run: |
          npm run build
          npx cap sync android

      # Version finale (non débogable). Si les secrets WH_KEYSTORE_BASE64 / WH_KEYSTORE_PASSWORD existent,
      # l'APK est signé avec cette clé privée ; sinon avec la clé du dépôt (compatibilité avec les téléphones déjà installés).
      - name: Construire l'APK
        working-directory: android
        env:
          WH_KEYSTORE_BASE64: ${{ secrets.WH_KEYSTORE_BASE64 }}
          WH_KEYSTORE_PASSWORD: ${{ secrets.WH_KEYSTORE_PASSWORD }}
          WH_KEY_ALIAS: ${{ secrets.WH_KEY_ALIAS }}
          WH_KEY_PASSWORD: ${{ secrets.WH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$WH_KEYSTORE_BASE64" ]; then
            echo "$WH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/wh.keystore"
            export WH_KEYSTORE_FILE="$RUNNER_TEMP/wh.keystore"
            echo "Signature avec la clé privée (secrets GitHub)"
          else
            unset WH_KEYSTORE_PASSWORD WH_KEY_ALIAS WH_KEY_PASSWORD
          fi
          ./gradlew assembleRelease --no-daemon -Pvc=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../WON-HOUSE-caisse.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WON-HOUSE-caisse-apk
          path: WON-HOUSE-caisse.apk

      - name: Publier la version (lien de téléchargement)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: WON HOUSE caisse v1.${{ github.run_number }}
          body: |
            Application Android de caisse du restaurant WON HOUSE.
            Téléchargez **WON-HOUSE-caisse.apk** sur le téléphone puis ouvrez-le pour l'installer.
          files: WON-HOUSE-caisse.apk
          make_latest: true
