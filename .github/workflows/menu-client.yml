name: Publier le menu client

# Publie la page « menu en ligne » (dossier client/) sur GitHub Pages :
# https://deograciasclinique-sketch.github.io/won-house-caisse/
# Une seule fois : Settings → Pages → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Préparer la page client
        run: |
          npm install --no-audit --no-fund
          npm run build
          # même contenu que le site publié depuis la branche : menu à la racine ET dans client/
          mkdir -p _site/client && cp -r client/. _site/ && cp -r client/. _site/client/ && touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
